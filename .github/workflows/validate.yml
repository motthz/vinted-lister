name: Validate project
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - if: runner.os == 'Linux'
        run: python -m playwright install --with-deps --only-shell chromium
      - if: runner.os == 'Windows'
        run: python -m playwright install --only-shell chromium
      - run: python -m ruff check .
      - run: python -m compileall -q app.py core.py publisher.py pick_folder.py
      - run: python -m coverage run --source=app,core,publisher -m unittest discover -v
      - run: python -m coverage report -m
      - run: python -m pip_audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots-${{ matrix.os }}
          path: artifacts/
